version: 1

# 手工核对过的补充线路（计划书 P5「L3 手工」这一档）
#
# 这里放的是聚合源里根本没有、或者聚合源里名字对不上被丢掉，但我逐条实测确认
# 在家里这张网上能真直播的台。为什么要单独一个文件：
# config/sources.yaml 里的聚合源是别人维护的，会整体更新，塞进去的手工成果
# 下次刷新就被冲掉了；而且聚合源结构里放不下「出处 / 核实日期 / 有效期」。
#
# 字段：
#   name     频道名，要能被 config/channels.yaml 的 name 或 aliases 认出来，
#            否则会在报告里落成「未匹配」而被丢掉
#   url      直连地址；带签名/鉴权参数的（咪咕那类）不要写进来，
#            代码里的鉴权红线会拒收，而且换 IP 换时间必播不动
#   group    config/channels.yaml 里的分组 id，只影响未匹配时的兜底归类
#   note     出处 + 实测结论。权利人或运营方提出异议就从本文件立即移除
#   added    核实日期
#   expires  有效期，留空表示不限；到期后生成时自动跳过并在终端提示
#
# 这些条目不免检：照样参与 build --verify 的实测与排序，
# 只是同条件下优先级排第一（LOCAL_ID -> 0）。

channels:
  - name: 湘潭新闻综合
    url: http://live.hnxttv.com:9601/live/xwzh/800K/tzwj_video.m3u8
    group: shizhou
    added: 2026-09-21
    expires: ""
    note: >-
      湘潭广电（xttv）自建的公网直播，不在任何聚合源里。
      2026-09-21 家里联通宽带实测 47ms、3 分片滑动窗口；L3 复测间隔 20s，
      MEDIA-SEQUENCE 2002 -> 2004 -> 2006 持续向前推进，分片名带
      20260921/12 日期目录，是真直播而不是循环录像。
      湘潭新闻综合在 hn_mobile 里只有移动 IPTV 内网地址，Wi-Fi 上必超时，
      这条是它唯一的公网出路。

