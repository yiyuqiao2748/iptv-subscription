version: 1

# 上游公开源注册表
#
# 增删源只改这个文件，不用动代码。
#   id        唯一标识：报告里的来源名 + data/cache/<id>.m3u 缓存文件名
#   url       上游地址（含中文会自动转义）
#   enabled   false = 完全不读取，但保留条目作为调研记录
#   probe     false = 跑 --verify 时不实测、原样保留（运营商内网源用）
#   priority  同一频道多线路时的排序权重，数字越小越靠前（默认按本节书写顺序）
#   note      实测结论与适用条件，避免以后重复踩坑

sources:
  - id: hn_unicom
    url: https://raw.githubusercontent.com/imDazui/Tvlist-awesome-m3u-m3u8/master/m3u/湖南联通.m3u
    enabled: true
    probe: false
    priority: 1
    note: >-
      ★ 主力湖南源（家里是湖南联通宽带）。57 条：湖南省台全家桶 +
      长沙新闻/政法/女性 + 怀化/常德/张家界/湘西。
      单一直连 IP http://58.20.64.92:9999（湖南联通 IPTV 出口），
      同网可达性最好，但一条源挂了就全挂，所以后面还得留着别的源兜底。

  - id: hn_mobile
    url: https://raw.githubusercontent.com/imDazui/Tvlist-awesome-m3u-m3u8/master/m3u/湖南移动.m3u
    enabled: true
    probe: false
    priority: 2
    note: >-
      覆盖最全的湖南源，192 条：10 省台（含湖南卫视 4K）+ 长沙 4 套 +
      13 市州新闻综合 + 市州第二频道 + 县级台，比联通源多出株洲/湘潭/岳阳/
      衡阳/邵阳/永州/娄底/益阳/郴州。指向 tvgslb.hn.chinamobile.com:8089
      （湖南移动 IPTV 门户），在联通宽带下能否可播待真机验证；
      但它是那 9 个市州台的唯一来源，所以必须留着。

  - id: iptv_api_gd
    url: https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/result.m3u
    enabled: true
    priority: 3
    note: >-
      通用聚合源，实测 1619 条、本机实测可用率约 69%。央视/卫视覆盖最好，
      湖南本地只有省台系，市州台几乎为零。头部带 x-tvg-url EPG 声明。
      注意：只有 gd 分支有产物，master 分支 404。

  - id: hn_telecom
    url: https://raw.githubusercontent.com/imDazui/Tvlist-awesome-m3u-m3u8/master/m3u/湖南电信IPTV.m3u
    enabled: false
    note: >-
      142 条全部是 rtp:// 组播地址，Apple TV 走普通 Wi-Fi 播不了，
      且组播属于计划书里已划定的红线，默认关闭，仅留调研记录。

  - id: iptv_org_cn
    url: https://iptv-org.github.io/iptv/countries/cn.m3u
    enabled: false
    note: >-
      实测 28KB、0 条湖南相关频道（国内频道因版权大量下架），
      对这个项目的本地化目标没有增益，关闭。
