version: 1

# 节目单（EPG）对照表
#
# 这一行 URL 会写进 aptv.m3u / hunan.m3u 头部的 `x-tvg-url`，APTV 拿它去对 `tvg-id`。
# 以前这里是「抄上游播放列表头部的第一条」（src/cli.py 里的 `epg = epg_urls[0]`），
# 抄来的那条实测 404（见下面 note 的第 1 条），所以改成自己填一份能用的，并写下证据。
#
#   url        订阅表头部写的地址；也是本工具抓取、缓存的地址
#   cache      抓回来的节目单落在哪（离线生成时读它；缓存里有今天就不联网）
#   enabled    false = 完全不读这个文件，回到「抄上游」的老行为
#   backup_url 换地址时抄这一条，别的不用动
#   note       为什么是这条，以及它的短板
#   caveat     启用它之后输出会长成什么样（会跟着进 report.md）
#
# 三条规矩记在这里，代码那边都有对应实现：
#   * 本机只把这份节目单用来决定 `tvg-id`；取不取到都不影响出表 ——
#     `apply_ids()` 拿到空单什么都不改（src/check/epg.py 的 doctest 钉着这条）。
#   * 地址不是 http(s) 就不写头部（`epg_header_url()`）：本地路径是给自己做实验用的，
#     电视拿不到，写进头部就是谎话。
#   * 换节目单 = 只改 `url` 一行，重跑一次生成即可；id 会跟着换，无需手抄。

epg:
  url: https://e.erw.cc/e.xml.gz
  cache: data/cache/epg.xml
  enabled: true
  note: >-
    2026-09-21 用 scripts/epg_check.py 量的四个候选（量的过程走的是这台开发机的代理出口，
    所以「拿得到」只证明服务活着，没证明家里那张 Wi-Fi 拿得到 —— 那一步要等干净出口或电视侧再确认）：
      1) 订阅表原来抄的那条
         https://gh-proxy.com/https://raw.githubusercontent.com/Guovin/iptv-api/refs/heads/master/output/epg/epg.gz
         → 404（14 字节响应体）。master 分支没有 epg 产物，和 result.m3u 只有 gd 分支是同一回事。
      2) gd 分支那份 https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/epg/epg.gz
         → 下载得到，但只有 75 个频道、节目停在 2026-08-07~08-08（距今 44 天）；
         那个仓库喂 EPG 的 config/epg.txt 现在整行被注释掉了，所以这份不会再更新。
      3) 本条 e.erw.cc → 248790 字节（gzip，解出 2628459 字节）、521 频道 / 18359 条节目 /
         覆盖 20260919~20260921（含今天）。对 data/output/aptv.m3u 现有的 98 个台配上 69 个
         （拿离线重出的那张 99 个台的表去量是 70 个：差的那一个台是 `香港卫视`，
         它 21:18 那轮三条线路全失败（403 / 12 秒超时）所以整台被删，与节目单无关），
         对 hunan.m3u 的 39 个台配上 10 个，是四个候选里最多的
         （湖南台系：经视/都市/娱乐/电影/电视剧/国际/爱晚 都有）。
         http 与 https 都是 200、内容逐字节相同（521 个频道的 id→台名映射比过一致），
         这里填 https：iOS 侧对明文地址更挑，且头部那行是电视自己去取的。
      4) https://epg.112114.xyz/pp.xml → 只有今天一天；2026-09-21 量 461 频道、配 61 个 / 8 个，
         2026-09-22 重量 553 频道 / 19122 条、配的个数一模一样（61 / 8），是个天天在更新的服务。
         好处是 channel id 是可读的（CCTV10、湖南卫视），坏处是覆盖比 3 少、
         每次要拉 2999603 字节**未压缩**的 XML（本条那份走 gzip，线上 248790 字节），
         而这个地址是电视自己每天去拉的。当成后备。
         换过来的代价在 2026-09-22 用 `build --replay` 当场量过（计划书 2.20）：
         与第 3 条共同配上 60 个台，而这 60 个台**两边给的 id 全都不一样**，
         所以从 erw 版退到这一份 = 98 个台里 69 个的 id 再换一遍（不是免费退路）；
         它比第 3 条少配 9 个（CCTV-1综合、CETV-1~4、安多卫视、湖南都市、金鹰卡通、金鹰纪实），
         多配 1 个（**长沙政法** —— 第 3 条里没有这个台）。
      5) 2026-09-23 晚（计划书 2.44）：这份文件以前有**两个读法** —— build 一份、
         `scripts/epg_check.py` 自己 `yaml.safe_load` 一份，四种「写得不太对」的写法量出四种答案，
         其中两种是冒充（`enabled: false`：build 整层关掉，尺子照印「配置里在用」；
         YAML 写坏了：和真的没写地址同一句）。现在只剩一个读法（`src.cli.load_epg_config`），
         尺子 import 它，两道闸也就同时管住了它。
         顺带把形状和真假各问了一遍，理由都在这一格里：`url:` 换行排成两条会被 YAML 读成列表，
         老代码 `str()` 一下它就冒充成一个地址 —— 非空所以算启用、不是 http 所以头部不写，
         当场量的后果是 `aptv.m3u` 第 1 行那句 `x-tvg-url` **整行消失**而其余 452 行逐字节相同；
         `enabled: "false"`（带引号那个）老代码走的是 `bool("false")` = **真**，
         你以为关了其实一直开着。这两种现在都停下来要人改那一行，不再出表。
         今天再看这份缓存是 518 频道 / 18078 条、含今天（09-22 早上记的是 519 / 18147）；
         至于「它那些数字 id 会不会天天重排」，今晚**量不了**：缓存只有一份、昨天那份已被覆盖，
         下面 caveat 那句结论的证据仍然只到 09-21↔09-22。
  backup_url: https://epg.112114.xyz/pp.xml
  caveat: >-
    这份节目单的 channel id 是 `1`、`81` 这种纯数字，而我们的台名里那些写法
    （`CCTV-1综合`、`湖南卫视`）在它里面按 id 一条都对不上，全靠 display-name 救回来 ——
    所以启用它之后输出里的 `tvg-id` 会**整个换成数字**（`tvg-name` 仍是人看的中文台名，不受影响）。
    按现在给电视那张表数：98 个台里 69 个的 id 会被换掉，湖南那张 39 个里只有 10 个 ——
    这一列 id 是 APTV 眼里的频道身份（收藏、隐藏都可能挂在它上面），所以换表之后要看一眼收藏。
    这不是错，是这张表的 id 从此由节目单说了算的证据；报告里「被改写 id 的台」那张表逐台列出来了。
    隔天再取一次核过：2026-09-22 早上这份是 519 频道 / 18147 条 / 覆盖 0920~0922，
    99 个台的 id 与前一天**一个都没变**（`epg_check.py --against` 量的），
    也就是说这份服务的数字 id 暂时没在天天重排 —— 但它是别人的服务，没有 SLA，说没就没；
    它挂了的时候这一层什么都不改（`apply_ids()` 拿到空单不动手），节目单只是「有更好」，不该把表搞坏。
