version: 1

# 流地址的可达范围
#
# 为什么需要这个文件：APTV 只会自动播某个频道的第一条线路，第二条要用遥控器手动切。
# 所以「看电视那张网根本够不到」的地址绝不能占第一顺位。
#
# 2026-09-20 真机反馈「订阅加得上、湖南台全部超时」的根因就在这里：
# hn_unicom / hn_mobile 覆盖最全，被 sources.yaml 排到 priority 1/2，
# 结果 hunan.m3u 里 39/39 个频道的第一条线路都是运营商 IPTV 内网地址。
#
# 匹配对象是 URL 的主机名，不区分大小写。写法：
#   foo.example.com   精确匹配
#   .example.com      后缀匹配（含裸域本身）
#   2409:             前缀匹配，用于 IPv6 网段
# 非 http(s) 协议（rtp/rtmp/udp 组播）由代码直接归入内网，不用写在这里。
#
# 判错的代价很小：范围只决定同一频道内的先后顺序，不会把线路从列表里删掉。

# 运营商 IPTV 内网 / 专线地址：只在对应运营商的 IPTV 专网里可达（通常是独立 VLAN，
# 甚至要走机顶盒的业务口），家庭 Wi-Fi 上表现为超时。
iptv_intranet:
  - tvgslb.hn.chinamobile.com    # 湖南移动 IPTV 门户，hn_mobile 源的唯一出口
  - .chinamobile.com             # 各省移动 IPTV 门户（黑龙江 ottrrs.hl、北京 ott.bj 等）
  - 58.20.64.92                  # 湖南联通 IPTV 出口，hn_unicom 源走它的 9999 端口
  - .gmcc.net                    # 移动 multicast 网关
  - "2409:"                      # 中国移动 IPv6 网段，跨网不可达
  - "2408:"                      # 中国联通 IPv6 网段

# 纯音频电台的 CDN。上游 iptv-api 会把电台地址挂在**电视频道**名下，
# 播出来只有声音 —— 比超时更容易骗过人（你会以为长沙新闻综合就长这样）。
# 所以这一档排在最后，而不是排在运营商内网之前。
# 保留不删的理由：视频线路全挂时，至少还有个能出声的备选，且它确实是该台的广播同播。
audio_only:
  - .qingting.fm                 # 蜻蜓 FM，上游有 22 条走它

